<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mascota Form</title>
</head>
<body>
<h2 th:text="${mode == 'edit' ? 'Editar mascota'}"></h2>
<p th:if="${error != null}" th:text="${error}" style="color:red;"></p>

<form method="post"
      th:action="${mode == 'edit'} ? @{/mascota/update}}"
      th:object="${MascotaForm}">
    <input type="hidden" th:field="*{id}" />
    <label>Nombre:</label>
    <input type="text" th:field="*{nombre}" /><br><br>
    <label>Especie:</label>
    <input type="text" th:field="*{especie}" /><br><br>
    <label>Raza:</label>
    <input type="text" th:field="*{raza}" maxlength="25" /><br><br>
    <label>Edad:</label>
    <input type="number" step="1" th:field="*{edad}" /><br><br>
    <label>Nombre del dueño:</label>
    <input type="text" th:field="*{nombreDueno}" /><br><br>
    <label>Teléfono:</label>
    <input type="text" th:field="*{telefono}" /><br><br>
    <label>Estado:</label>
    <input type="text" th:field="*{estado}" /><br><br>

    <button type="submit" th:text="${mode == 'edit' ? 'Actualizar'}"></button>
</form>

<p><a th:href="@{/mascota/list}">Ver lista</a></p>
</body>
</html>
